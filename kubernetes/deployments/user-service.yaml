# Replace <ACR_LOGIN_SERVER> with the acr_login_server Terraform output
# before applying — see docs/deployment_phases/phase-05-aks.md.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ecommerce
  labels:
    app: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: ecommerce-workload-sa
      containers:
        - name: user-service
          image: acrecommerceprod1999.azurecr.io/user-service:latest
          ports:
            - containerPort: 3001
          env:
            - name: PORT
              value: "3001"
            - name: NODE_ENV
              value: "production"
            - name: SQL_SERVER
              value: "sql-ecommerce-prod.database.windows.net"
            - name: SQL_DATABASE
              value: "sqldb-ecommerce-prod"
            - name: SQL_USER
              value: "zaryab"
          envFrom:
            - secretRef:
                name: app-secrets
                optional: true
          resources:
            requests:
              cpu: 30m
              memory: 128Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 20
      # Phase 9 adds a secrets-store CSI volume + volumeMount here, once
      # kubernetes/secrets/secretproviderclass.yaml exists to reference —
      # see docs/deployment_phases/phase-09-secrets.md. Deliberately absent
      # until then so this Deployment works standalone from Phase 5 on.
