# Federated with id-<project>-aks-<env> (Phase 1) via the aks module's
# azurerm_federated_identity_credential (Phase 5). Any pod using this
# ServiceAccount can request an Azure AD token for that identity — no
# secret. Replace <WORKLOAD_IDENTITY_CLIENT_ID> with the aks_workload_identity_client_id
# Terraform output before applying.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecommerce-workload-sa
  namespace: ecommerce
  annotations:
    azure.workload.identity/client-id: "<WORKLOAD_IDENTITY_CLIENT_ID>"
  labels:
    azure.workload.identity/use: "true"
