# Copy this file to app-secrets.yaml (gitignored — never commit the real one)
# and fill in real values, then:
#   kubectl apply -f kubernetes/secrets/app-secrets.yaml
#
# `stringData` (not `data`) lets you write plaintext values directly — Kubernetes
# base64-encodes them automatically on apply, so you never have to encode
# anything by hand.
#
# This is the temporary, manual-Secret approach for Phases 6/7 (SQL password,
# Service Bus connection string). Phase 9 (Key Vault + CSI driver) supersedes
# this file entirely — once that's built, delete this Secret and let the
# SecretProviderClass sync it from Key Vault instead. See
# docs/deployment_phases/phase-06-databases.md, phase-07-messaging.md, and
# phase-09-secrets.md.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: ecommerce
type: Opaque
stringData:
  SQL_PASSWORD: "<SQL_PASSWORD>"
  # Uncomment once Phase 7 (Service Bus) is done:
  # SERVICEBUS_CONNECTION_STRING: "<SERVICEBUS_CONNECTION_STRING>"
