# Phase 9 — mounted by each Deployment's pod (via the ecommerce-workload-sa
# ServiceAccount's federated identity) and synced into a plain Kubernetes
# Secret "app-secrets" that the Deployments already reference via envFrom —
# this SUPERSEDES any manual `kubectl create secret` you ran in Phase 6/7;
# delete those manual secrets once this is applied (they'd otherwise shadow
# the synced one, or just get overwritten — kubectl apply here wins either way).
#
# Replace <KEY_VAULT_NAME> and <TENANT_ID> before applying — from the
# keyvault_uri Terraform output and your tenant_id var, respectively.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ecommerce-secrets
  namespace: ecommerce
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "<WORKLOAD_IDENTITY_CLIENT_ID>"
    keyvaultName: "<KEY_VAULT_NAME>"
    tenantId: "<TENANT_ID>"
    objects: |
      array:
        - |
          objectName: sql-admin-password
          objectType: secret
        - |
          objectName: servicebus-connection-string
          objectType: secret
        - |
          objectName: jwt-secret
          objectType: secret
  secretObjects:
    - secretName: app-secrets
      type: Opaque
      data:
        - objectName: sql-admin-password
          key: SQL_PASSWORD
        - objectName: servicebus-connection-string
          key: SERVICEBUS_CONNECTION_STRING
        - objectName: jwt-secret
          key: JWT_SECRET
